version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * 12 *"
    cooldown:
      default-days: 7
    groups:
      backend-dev-deps:
        dependency-type: "development"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * 12 *"
    cooldown:
      default-days: 7
    groups:
      gha-deps:
        patterns:
          - "*"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 0 * 12 *"
    cooldown:
      default-days: 7
    groups:
      pre-commit-deps:
        patterns:
          - "*"
